<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>状态 · 鸿渚の灵质空间</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="common.css">
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
  document.documentElement.setAttribute('data-color-theme', localStorage.getItem('colorTheme') || 'default');
  document.documentElement.style.setProperty('--glass-alpha', (localStorage.getItem('hz_glass_alpha') || 65) / 100);
</script>
<style>
.main-container { max-width: 1100px; margin: 90px auto 60px; padding: 0 1.5rem; }
.page-title { font-size: 1.6rem; font-weight: 700; color: var(--primary-600); margin-bottom: 1.2rem; display: flex; align-items: center; gap: .5rem; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.6rem; }
.tag-chip { padding: 6px 14px; border-radius: 40px; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--text-title); font-size: .85rem; cursor: pointer; transition: var(--transition); }
.tag-chip:hover, .tag-chip.active { background: var(--primary-500); border-color: var(--primary-500); color: #fff; }
.tag-count { opacity: .7; margin-left: 4px; font-size: .75rem; }
.item-list { display: grid; gap: .9rem; }
.item-card { padding: 1rem 1.2rem; border: 1px solid var(--border-light); border-radius: 14px; background: var(--bg-card); cursor: pointer; transition: var(--transition); }
.item-card:hover { border-color: var(--primary-400); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.item-card h3 { font-size: 1rem; margin-bottom: .35rem; color: var(--text-title); }
.item-card p { font-size: .85rem; color: var(--text-muted); }
.item-card .item-date { font-size: .75rem; color: var(--text-muted); margin-bottom: .3rem; }
.timeline { position: relative; padding-left: 1.6rem; border-left: 2px solid var(--border-light); }
.timeline-item { position: relative; margin-bottom: 1.4rem; }
.timeline-item::before { content: ''; position: absolute; left: -1.95rem; top: .35rem; width: 10px; height: 10px; border-radius: 50%; background: var(--primary-500); border: 2px solid var(--bg-page); }
.status-grid { display: grid; gap: .5rem; }
.status-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .6rem .9rem; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; font-size: .85rem; }
.status-ok { color: #10b981; font-weight: 700; }
.status-fail { color: #ef4444; font-weight: 700; }
.status-path { color: var(--text-muted); font-family: monospace; font-size: .8rem; word-break: break-all; }
</style>
</head>
<body>
<div class="bg-layer"></div>
<main class="main-container" id="pageMain">
    <h2 class="page-title"><i class="fas fa-signal"></i> 数据状态</h2>
    <div id="statusSummary" style="margin-bottom:1rem;color:var(--text-muted);font-size:.9rem;">检查中...</div>
    <div id="statusGrid" class="status-grid"><div class="loading-skeleton">加载中...</div></div>
</main>
<script src="common.js"></script>
<script>

(function () {
    var summary = document.getElementById('statusSummary');
    var grid = document.getElementById('statusGrid');

    async function check(url) {
        var t0 = performance.now();
        try {
            var r = await fetch(url, { cache: 'no-cache' });
            return { url: url, ok: r.ok, code: r.status, ms: Math.round(performance.now() - t0) };
        } catch (e) {
            return { url: url, ok: false, code: 'ERR', ms: Math.round(performance.now() - t0) };
        }
    }

    (async function () {
        var list = ['data-index.json'];
        ['wallpapers', 'emojis', 'friends', 'notifications', 'projects', 'quotes', 'webos'].forEach(function (n) {
            list.push('data/' + n + '.json');
        });
        ['zh', 'en', 'ja', 'ko'].forEach(function (l) { list.push('lang/' + l + '.json'); });

        var idx = await loadJSON('data-index.json');
        [].concat(idx.articles || [], idx.cards || [], idx.files || []).forEach(function (p) { list.push(p); });

        var results = [];
        for (var i = 0; i < list.length; i++) results.push(await check(list[i]));

        var okCount = results.filter(function (r) { return r.ok; }).length;
        summary.innerHTML = '共 <b>' + results.length + '</b> 项，成功 <b style="color:#10b981">' + okCount + '</b>，失败 <b style="color:#ef4444">' + (results.length - okCount) + '</b>';

        grid.innerHTML = results.map(function (r) {
            var cls = r.ok ? 'status-ok' : 'status-fail';
            var txt = r.ok ? ('OK ' + r.code) : ('FAIL ' + r.code);
            return '<div class="status-row"><span class="status-path">' + escapeHtml(r.url) + '</span>' +
                '<span class="' + cls + '">' + txt + ' · ' + r.ms + 'ms</span></div>';
        }).join('');
    })();
})();

</script>
</body>
</html>
