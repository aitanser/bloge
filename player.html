<!-- 兜底文件 -->
<div id="floatingPlayer" class="floating-player">
    <div class="player-titlebar" id="playerTitlebar">
        <div class="title-left-group" style="display:flex; align-items:center; gap:6px;">
            <button class="breakout-btn" id="breakoutBtn" style="background:none;border:none;color:var(--primary-400);cursor:pointer;"><i class="fas fa-external-link-alt"></i></button>
            <div class="player-title" style="font-size:0.9rem; font-weight:600;"><i class="fas fa-head-side-vr"></i> 鸿渚音乐</div>
        </div>
        <div class="player-window-buttons" style="display:flex; gap:6px; align-items:center;">
            <button class="win-btn minimize" id="winMinimizeBtn">_</button>
            <button class="win-btn maximize" id="winMaximizeBtn">🗖</button>
            <button class="win-btn close" id="winCloseBtn">✕</button>
        </div>
    </div>
    <div class="player-content" style="flex:1; display:flex; position:relative; min-height:0;">
        <iframe id="playerIframe" src="about:blank" allow="autoplay; fullscreen" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none; display:block;"></iframe>
    </div>
</div>
